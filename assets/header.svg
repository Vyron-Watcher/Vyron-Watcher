    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1d3550" stroke-width="1" opacity=".5"/></pattern>
    
    <style>
      .name { font: 700 42px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .role { font: 400 20px 'SFMono-Regular', Consolas, 'Courier New', monospace; fill: #5eead4; }
      .dim  { font: 400 15px 'SFMono-Regular', Consolas, monospace; fill: #64748b; }
      .node { fill: #0f2236; stroke: #2dd4bf; stroke-width: 1.5; }
      .lbl  { font: 600 12px 'SFMono-Regular', Consolas, monospace; fill: #cbd5e1; text-anchor: middle; }
      .line { stroke: #2dd4bf; stroke-width: 1.5; stroke-dasharray: 5 6; opacity: .6; animation: flow 1.2s linear infinite; }
      .coin { fill: #fbbf24; }
      .ok   { font: 600 13px 'SFMono-Regular', Consolas, monospace; fill: #34d399; }
      .cur  { fill: #5eead4; opacity: .85; animation: blink 1s steps(1) infinite; }
      .pulse { fill: none; stroke: #2dd4bf; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
      @keyframes flow  { to { stroke-dashoffset: -11; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .line, .cur, .pulse { animation: none; } }
    </style>
